[tools]
bats = "1.14.0"
ffmpeg = "7.1.1"
node = "24.18.0"
pnpm = "10.34.5"
shellcheck = "0.11.0"
shfmt = "v3.13.1"
taplo = "0.10.0"
"pipx:whisperx" = "v3.8.6"
uv = "0.11.14"

[env]
_.file = ".env"

[tasks.setup]
description = "依存パッケージの導入と git hook のインストール"
run = '''
pnpm install
# git worktree ではルートリポジトリ側の lefthook 設定を使うためスキップ
if [ -d ".git" ]; then
  pnpm exec lefthook install
fi
'''

[tasks.clean]
description = "setup が生成したファイルの削除"
run = '''
git clean -fdx node_modules
'''

[tasks."format:sh"]
description = "shfmt でシェルスクリプトを整形 (--check で崩れを検査)"
usage = '''
arg "[files]" var=#true
flag "--check"
'''
run = '''
files=${usage_files:-$(git ls-files -co --exclude-standard '*.sh' | tr '\n' ' ')}
if [ -z "$files" ]; then exit 0; fi
eval "set -- $files"
if [ -n "${usage_check:-}" ]; then
  shfmt -d -i 2 -ci "$@"
else
  shfmt -w -i 2 -ci "$@"
fi
'''

[tasks."format:yaml"]
description = "prettier で YAML を整形 (--check で崩れを検査)"
usage = '''
arg "[files]" var=#true
flag "--check"
'''
run = '''
eval "set -- ${usage_files:-'**/*.{yml,yaml}'}"
if [ -n "${usage_check:-}" ]; then
  pnpm exec prettier --check "$@"
else
  pnpm exec prettier --write "$@"
fi
'''

[tasks."format:md"]
description = "prettier で Markdown を整形 (--check で崩れを検査)"
usage = '''
arg "[files]" var=#true
flag "--check"
'''
run = '''
files=${usage_files:-$(git ls-files -co --exclude-standard '*.md' | tr '\n' ' ')}
if [ -z "$files" ]; then exit 0; fi
eval "set -- $files"
if [ -n "${usage_check:-}" ]; then
  pnpm exec prettier --check "$@"
else
  pnpm exec prettier --write "$@"
fi
'''

[tasks."format:toml"]
description = "taplo で TOML を整形 (--check で崩れを検査)"
usage = '''
arg "[files]" var=#true
flag "--check"
'''
run = '''
files=${usage_files:-$(git ls-files -co --exclude-standard '*.toml' | tr '\n' ' ')}
if [ -z "$files" ]; then exit 0; fi
eval "set -- $files"
if [ -n "${usage_check:-}" ]; then
  taplo format --check "$@"
else
  taplo format "$@"
fi
'''

[tasks."format:cspell"]
description = ".cspell.json の words を整列"
usage = '''
flag "--help" hide=#true
'''
run = '''
jq '.words |= (map(ascii_downcase) | sort | unique)' .cspell.json >.cspell.json.tmp
mv .cspell.json.tmp .cspell.json
pnpm exec prettier --write .cspell.json
'''

[tasks.format]
description = "全ファイルを整形"
depends = [
  "format:sh",
  "format:yaml",
  "format:md",
  "format:toml",
  "format:cspell",
]

[tasks."format:check"]
description = "全ファイルの整形崩れを検査"
depends = [
  "format:sh --check",
  "format:yaml --check",
  "format:md --check",
  "format:toml --check",
]

[tasks."lint:sh"]
description = "shellcheck でシェルスクリプトを検査"
usage = '''
arg "[files]" var=#true
'''
run = '''
files=${usage_files:-$(git ls-files -co --exclude-standard '*.sh' | tr '\n' ' ')}
if [ -z "$files" ]; then exit 0; fi
eval "set -- $files"
shellcheck -- "$@"
'''

[tasks."lint:md"]
description = "markdownlint-cli2 で Markdown を検査"
usage = '''
arg "[files]" var=#true
'''
run = '''
files=${usage_files:-$(git ls-files -co --exclude-standard '*.md' | tr '\n' ' ')}
if [ -z "$files" ]; then exit 0; fi
eval "set -- $files"
pnpm exec markdownlint-cli2 "$@"
'''

[tasks."lint:cspell"]
description = "cspell でスペルを検査"
usage = '''
arg "[files]" var=#true
'''
run = '''
eval "set -- ${usage_files:-'.'}"
pnpm exec cspell lint --no-progress --no-must-find-files "$@"
'''

[tasks.lint]
description = "全ファイルを検査"
depends = [
  "lint:sh",
  "lint:md",
  "format:yaml --check",
  "format:md --check",
  "format:toml --check",
  "lint:cspell",
]

[tasks.test]
description = "全テストを実行"
depends = ["test:sh"]

[tasks."test:sh"]
description = "bats でシェルテストを実行"
run = '''
bats tests/
'''
