# lefthook は hook ごとに出力を変えられない。post-checkout がブランチを切り替えるたびに
# 見出しを出すのを止めるため全体を絞る。落ちた job の名前と出力は残る。
output:
  - failure

pre-commit:
  jobs:
    - name: format
      skip:
        - rebase
        - merge
        - revert
      group:
        parallel: true
        jobs:
          - name: prettier
            glob: "*.{yml,yaml}"
            stage_fixed: true
            run: mise run format:yaml {staged_files}
          - name: shfmt
            glob: "*.sh"
            stage_fixed: true
            run: mise run format:sh {staged_files}
          - name: ruff format
            glob: "*.py"
            stage_fixed: true
            run: mise run format:py {staged_files}
          - name: markdown
            glob: "*.md"
            stage_fixed: true
            run: mise run format:md {staged_files}
          - name: toml
            glob: "*.toml"
            stage_fixed: true
            run: mise run format:toml {staged_files}
          - name: sort cspell file
            glob: ".cspell.json"
            stage_fixed: true
            run: mise run format:cspell
    - name: lint
      skip:
        - rebase
        - merge
        - revert
      group:
        parallel: true
        jobs:
          - name: prettier
            glob: "*.{yml,yaml}"
            run: mise run format:yaml --check {staged_files}
          - name: prettier-md-check
            glob: "*.md"
            run: mise run format:md --check {staged_files}
          - name: markdownlint
            glob: "*.md"
            run: mise run lint:md {staged_files}
          - name: taplo-check
            glob: "*.toml"
            run: mise run format:toml --check {staged_files}
          - name: shellcheck
            glob: "*.sh"
            run: mise run lint:sh {staged_files}
          - name: ruff format check
            glob: "*.py"
            run: mise run format:py --check {staged_files}
          - name: ruff check
            glob: "*.py"
            run: mise run lint:py {staged_files}
          - name: spell check
            run: mise run lint:cspell {staged_files}
    - name: test
      skip:
        - rebase
        - merge
        - revert
      glob: "*.{sh,bats}"
      run: mise run test:sh

post-checkout:
  jobs:
    # git worktree add もこのフックを通り、失敗すると worktree の作成が失敗扱いになるため、必ず 0 で終える
    - name: copy-env
      # output: [failure] は 0 で終わる job の警告も消すので、この job だけ絞らずに出す
      interactive: true
      run: |
        [ "{1}" = 0000000000000000000000000000000000000000 ] || exit 0
        [ -e .env ] && exit 0
        src="$(git rev-parse --path-format=absolute --git-common-dir)/../.env"
        cp "$src" .env 2>/dev/null || echo "warning: could not copy $src" >&2
        exit 0
