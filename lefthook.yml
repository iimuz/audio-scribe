pre-commit:
  jobs:
    - name: format
      skip:
        - rebase
        - merge
        - revert
      group:
        parallel: true
        jobs:
          - name: prettier
            glob: "*.{yml,yaml}"
            stage_fixed: true
            run: mise run format:yaml {staged_files}
          - name: ruff
            glob: "*.{py}"
            stage_fixed: true
            run: |
              uv run ruff format {staged_files}
              uv run ruff check --fix {staged_files}
          - name: shfmt
            glob: "*.sh"
            stage_fixed: true
            run: mise run format:sh {staged_files}
          - name: sort cspell file
            glob: ".cspell.json"
            stage_fixed: true
            run: mise run format:cspell
    - name: lint
      skip:
        - rebase
        - merge
        - revert
      group:
        parallel: true
        jobs:
          - name: ruff
            glob: "*.py"
            run: uv run ruff check {staged_files}
          - name: prettier
            glob: "*.{yml,yaml}"
            run: mise run format:yaml --check {staged_files}
          - name: shellcheck
            glob: "*.sh"
            run: mise run lint:sh {staged_files}
          - name: spell check
            run: mise run lint:cspell {staged_files}
